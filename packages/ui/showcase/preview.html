<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" />
  <link rel="stylesheet" href="../tokens/tokens.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <style>
    body { margin: 0; min-height: 100vh; }
    #stage { display: grid; place-items: center; min-height: 100vh; padding: var(--vy-space-8) var(--vy-space-4); }
    #stage.is-full { place-items: start stretch; padding: 0; }
    #stage .vy-modal { position: static; margin: 0; }
  </style>
</head>
<body class="vy-root">
  <div id="stage"></div>
  <script src="brand-paths.js"></script>
  <script src="shared.js"></script>
  <script>
    // Receives { html, theme, motion, full } from the playground via postMessage
    // (works across file:// origins, unlike direct frame scripting).
    window.addEventListener('message', (e) => {
      const m = e.data;
      if (!m || m.type !== 'vy-preview') return;
      document.documentElement.dataset.theme = m.theme;
      document.documentElement.dataset.motion = m.motion;
      const stage = document.getElementById('stage');
      stage.className = m.full ? 'is-full' : '';
      stage.innerHTML = m.html;
      VY.hydrate(stage);
    });
    parent.postMessage({ type: 'vy-preview-ready' }, '*');
  </script>
</body>
</html>
